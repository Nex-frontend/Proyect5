{% extends 'base.html' %}
{% block content %}
<h2>Carga - Concepto 56</h2>
<div id="drop-area" class="drag-area">
  Arrastra y suelta archivos aquí o haz clic para seleccionar.
  <input id="fileElem" type="file" multiple style="display:none" />
</div>
<div id="upload-result" style="margin-top:1rem;"></div>

<script>
/* same JS as other concept page */
document.addEventListener('DOMContentLoaded', () => {
  const dropArea = document.getElementById('drop-area');
  const fileElem = document.getElementById('fileElem');
  if (!dropArea || !fileElem) return;
  ['dragenter','dragover','dragleave','drop'].forEach(evt => dropArea.addEventListener(evt, e=>{e.preventDefault();e.stopPropagation();}, false));
  dropArea.addEventListener('click', ()=>fileElem.click());
  fileElem.addEventListener('change', e=>uploadFiles(e.target.files));
  dropArea.addEventListener('drop', e=>uploadFiles(e.dataTransfer.files));

  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }

  function uploadFiles(files){
    const fd = new FormData();
    for (let i=0;i<files.length;i++) fd.append('files', files[i]);
    const out = document.getElementById('upload-result');
    if (out) out.innerHTML = 'Procesando...';
    fetch(window.location.pathname, { method: 'POST', headers: {'X-CSRFToken': getCookie('csrftoken')}, body: fd })
      .then(response => {
        const ct = response.headers.get('content-type') || '';
        if (ct.includes('application/json')) return response.json();
        return response.text();
      })
      .then(data => {
        if (!out) return;
        if (typeof data === 'string') {
          out.innerHTML = 'Respuesta del servidor:<br><pre>'+data+'</pre>';
          return;
        }
        let html = '';
        if (data.ok) {
          html += `<div><strong>Registros creados:</strong> ${data.created}</div>`;
          if (data.errors && data.errors.length) {
            html += `<div><strong>Errores (${data.errors.length}):</strong><ul>`;
            data.errors.slice(0,50).forEach(e=>{
              html += `<li>${e.file || ''} line ${e.line || ''}: ${e.error || JSON.stringify(e)}</li>`;
            });
            if (data.errors.length > 50) html += `<li>...(${data.errors.length - 50} más)</li>`;
            html += `</ul></div>`;
          }
        } else {
          html = '<div>Error en la carga.</div>';
          if (data.errors) html += `<pre>${JSON.stringify(data.errors,null,2)}</pre>`;
        }
        out.innerHTML = html;
      })
      .catch(err=>{ if (out) out.innerHTML = 'Error: '+err; });
  }
});
</script>
{% endblock %}
