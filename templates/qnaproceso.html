{% extends 'base.html' %}
{% block content %}
<h2>Carga - Quincena de proceso</h2>

<form id="qnaproceso-form" action="" method="post"> {# Formulario de quincena de proceso #}
  {% csrf_token %} {# Token de seguridad #}
  <fieldset> {# Campos del formulario #}
    <label style="display:flex; align-items:center; gap:1rem;">
      <span style="min-width: 160px;">Quincena de Proceso</span>
      <input 
        type="text" 
        name="qna_proceso" 
        value="{{ qna_ini }}"
        placeholder="AAAAQQ" 
        pattern="\d{6}"
        maxlength="6"
        inputmode="numeric"
        required
        style="max-width: 160px;"
      />
    </label>
  </fieldset>

  <fieldset> {# Campos del formulario #}
    <label style="display:flex; align-items:center; gap:1rem;">
      <span style="min-width: 160px;">Lote</span>
      <input 
        type="text" 
        name="lote" 
        value="{{ lote_anterior }}"
        placeholder="2500" 
        pattern="\d{4}"
        maxlength="4"
        inputmode="numeric"
        required
        style="max-width: 120px;"
      />
    </label>
  </fieldset>

  <div style="margin-top:1rem; display:flex; justify-content:left;">
    <label style="display:flex; align-items:center; gap:1rem;">
      <span style="min-width:160px">Selecciona el concepto a cargar</span>
      <select id="concept-select" style="max-width:210px;" name="concept_select">
        <option value="">-- Seleccionar --</option>
        <option value="55">55</option>
        <option value="56">56</option>
        <option value="64">64</option>
      </select>
    </label>
  </div>
  <!-- hidden input para enviar el concepto seleccionado en el POST al pulsar Cargar -->
  <input type="hidden" id="concept-input" name="concept" value="" />

  <div style="display:flex; gap:1rem; justify-content:center; margin-top:1rem;"> {# Botones del formulario #}
    <button type="submit" name="save" class="btn-entrar">Cargar</button>
    <button type="submit" name="cancel" class="btn-entrar" formnovalidate>Cancelar</button>
  </div>

</form>

<script> // Script para validar los campos
  // Restringe a dígitos y respeta maxlength
  document.addEventListener('input', function(e){ // Evento de entrada
    if (e.target.name === 'qna_proceso' || e.target.name === 'lote') { // Campos a validar
      e.target.value = e.target.value.replace(/\D+/g,'').slice(0, e.target.maxLength || 99); // Restringe a dígitos y respeta maxlength
    }
  });
  // Al cambiar el select sólo sincronizamos el hidden input; la redirección se hace al pulsar "Cargar"
  document.getElementById('concept-select')?.addEventListener('change', function(e){
    const v = e.target.value;
    const hid = document.getElementById('concept-input');
    if (hid) hid.value = v || '';
  });

  // Asegurar que al enviar el formulario siempre se copie el valor del select al hidden
  const qpForm = document.getElementById('qnaproceso-form');
  if (qpForm){
    qpForm.addEventListener('submit', function(e){
      const sel = document.getElementById('concept-select');
      const hid = document.getElementById('concept-input');
      if (hid && sel) hid.value = sel.value || '';
      return true;
    });
  }
</script>
{% endblock %}
