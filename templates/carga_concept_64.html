{% extends 'base.html' %}
{% block content %}
<h2>Carga - Concepto 64</h2>


<div style="background-color: #15bedb; border: 1px solid #000000; padding: 10px; margin-bottom: 20px; border-radius: 5px;">
    <strong>📋 Configuración Actual:</strong> Quincena <strong>{{ qna_ini }}</strong> | Lote <strong>{{ lote_anterior }}</strong>
</div>
<div id="drop-area" class="drag-area">
  Arrastra y suelta archivos aquí o haz clic para seleccionar.
  <input id="fileElem" type="file" multiple style="display:none" />
</div>
<div id="preview-area" style="margin-top:1rem;"></div>
<div style="margin-top:0.5rem;">
  <button id="confirm-upload" disabled class="btn-entrar">Confirmar carga</button>
  <button id="clear-preview" disabled class="btn-entrar">Borrar previsualización</button>
</div>
<div id="upload-result" style="margin-top:1rem;"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const dropArea = document.getElementById('drop-area');
  const fileElem = document.getElementById('fileElem');
  if (!dropArea || !fileElem) return;
  ['dragenter','dragover','dragleave','drop'].forEach(evt => dropArea.addEventListener(evt, e=>{e.preventDefault();e.stopPropagation();}, false));
  dropArea.addEventListener('click', ()=>fileElem.click());
  fileElem.addEventListener('change', e=>uploadFiles(e.target.files));
  dropArea.addEventListener('drop', e=>uploadFiles(e.dataTransfer.files));

  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }

  function renderPreviewTable(records){
    const preview = document.getElementById('preview-area');
    if (!preview) return;
    if (!records || !records.length){ preview.innerHTML = '<em>No hay registros para previsualizar.</em>'; return; }
    let html = '<div><strong>Previsualización ('+records.length+')</strong></div>';
    html += '<table class="table" style="width:100%; border-collapse:collapse; margin-top:0.5rem;">';
    html += '<thead><tr><th>RFC</th><th>Nombre</th><th>Tipo</th><th>Importe</th><th>Cpto</th><th>Qna</th><th>Lote</th><th>Ptje</th></tr></thead><tbody>';
    records.forEach(r=>{
      const isDup = r.duplicate_preview || r.duplicate_existing;
      const dupMark = isDup ? ' <span style="color:#a00;">⚠️</span>' : '';
      html += '<tr'+(isDup? ' style="background:#ffecec"':'')+'>'+
        '<td>'+ (r.rfc||'') + dupMark +'</td>'+
        '<td>'+ (r.nombre||'') +'</td>'+
        '<td>'+ (r.tipo||'') +'</td>'+
        '<td>'+ (r.impor||'') +'</td>'+
        '<td>'+ (r.cpto||'') +'</td>'+
        '<td>'+ (r.qna||'') +'</td>'+
        '<td>'+ (r.lote_anterior||'') +'</td>'+
        '<td>'+ (r.ptje||'') +'</td>'+
      '</tr>';
    });
    html += '</tbody></table>';
    preview.innerHTML = html;
  }

  function escapeHtml(unsafe){
    return unsafe.replace(/[&<"'>]/g, function(m){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]; });
  }

  async function uploadFiles(files){
    const fd = new FormData();
    for (let i=0;i<files.length;i++) fd.append('files', files[i]);
    const out = document.getElementById('upload-result');
    const confirmBtn = document.getElementById('confirm-upload');
    const clearBtn = document.getElementById('clear-preview');
    if (out) out.innerHTML = 'Generando previsualización...';
    try{
      const resp = await fetch('/api/preview/', { method: 'POST', headers: {'X-CSRFToken': getCookie('csrftoken')}, body: fd });
      const ct = resp.headers.get('content-type') || '';
      if (!ct.includes('application/json')){
        const text = await resp.text();
        out.innerHTML = '<div class="error">Respuesta inesperada del servidor (no JSON):</div><pre>'+escapeHtml(text)+'</pre>';
        return;
      }
      const data = await resp.json();
      if (!data.ok){
        out.innerHTML = '<div class="error">Error: '+ (data.error||'Error en preview') +'</div>';
        return;
      }
      renderPreviewTable(data.preview_records || []);
      out.innerHTML = `<div>Registros en preview: ${data.preview_count}.</div>`;
      if (data.errors && data.errors.length){
        out.innerHTML += `<div><strong>Errores:</strong><ul>`+ data.errors.slice(0,50).map(e=>`<li>${e.file||''} l:${e.line||''} ${e.error||''}</li>`).join('') +`</ul></div>`;
      }
      // Deshabilitar confirmar si no hay registros o si hay duplicados (en preview o ya en BD)
      if (confirmBtn) confirmBtn.disabled = !(data.preview_count>0) || !!data.has_duplicates;
      if (data.has_duplicates){
        out.innerHTML += `<div class="error"><strong>Advertencia:</strong> Hay registros duplicados en la previsualización o que ya existen en la base de datos. Corrige antes de confirmar.</div>`;
      }
      if (clearBtn) clearBtn.disabled = false;
    }catch(err){ if (out) out.innerHTML = 'Error: '+err; }
  }

  async function confirmUpload(){
    const out = document.getElementById('upload-result');
    if (out) out.innerHTML = 'Confirmando carga...';
    const fd = new FormData(); fd.append('confirm','1');
    try{
      const resp = await fetch('/api/upload/', { method: 'POST', headers: {'X-CSRFToken': getCookie('csrftoken')}, body: fd });
      const ct = resp.headers.get('content-type') || '';
      if (!ct.includes('application/json')){
        const text = await resp.text();
        out.innerHTML = '<div class="error">Respuesta inesperada del servidor (no JSON):</div><pre>'+escapeHtml(text)+'</pre>';
        return;
      }
      const data = await resp.json();
      if (data.ok){
        out.innerHTML = `<div><strong>Registros creados:</strong> ${data.created}</div>`;
        if (data.errors && data.errors.length) out.innerHTML += `<pre>${JSON.stringify(data.errors,null,2)}</pre>`;
        // limpiar preview UI
        renderPreviewTable([]);
        document.getElementById('confirm-upload').disabled = true;
        document.getElementById('clear-preview').disabled = true;
      } else {
        out.innerHTML = '<div class="error">Error: '+ (data.error||'No se confirmó') +'</div>';
      }
    }catch(err){ if (out) out.innerHTML = 'Error: '+err; }
  }

  async function clearPreview(){
    const out = document.getElementById('upload-result');
    if (out) out.innerHTML = 'Limpiando previsualización...';
    try{
      const resp = await fetch('/api/clear_preview/', { method: 'POST', headers: {'X-CSRFToken': getCookie('csrftoken')} });
      const ct = resp.headers.get('content-type') || '';
      if (!ct.includes('application/json')){
        const text = await resp.text();
        if (out) out.innerHTML = '<div class="error">Respuesta inesperada del servidor (no JSON):</div><pre>'+escapeHtml(text)+'</pre>';
        return;
      }
      const data = await resp.json();
      if (data.ok){
        renderPreviewTable([]);
        if (out) out.innerHTML = '<div>Previsualización eliminada.</div>';
        document.getElementById('confirm-upload').disabled = true;
        document.getElementById('clear-preview').disabled = true;
      } else {
        if (out) out.innerHTML = '<div class="error">Error al limpiar preview</div>';
      }
    }catch(err){ if (out) out.innerHTML = 'Error: '+err; }
  }

  document.getElementById('confirm-upload')?.addEventListener('click', e=>{ e.preventDefault(); confirmUpload(); });
  document.getElementById('clear-preview')?.addEventListener('click', e=>{ e.preventDefault(); clearPreview(); });
});
</script>
{% endblock %}
